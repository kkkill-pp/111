name: Sprint 0 & v3.0 Protocol Freeze — PostgreSQL 15+ & Contract Gate

on:
  push:
    branches: [main, develop]
  pull_request:

defaults:
  run:
    shell: bash

jobs:
  contract-and-db-gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_password
          POSTGRES_DB: aivs_sprint0_empty
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies, ffmpeg, CJK fonts & postgresql-client
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-cjk fontconfig postgresql-client
          pip install -r requirements.txt

      - name: Verify CJK Font Resolution Under Bundled Fontconfig (P1-E4)
        run: |
          set -euo pipefail
          FONTCONFIG_FILE="$PWD/assets/fonts/openshorts-fontmap.conf" fc-match "Noto Sans CJK SC" | tee /tmp/fc_match.txt
          grep -iE "Noto.*CJK|CJK" /tmp/fc_match.txt

      - name: License Redline Guard (LIC-001 — forbid cloud/ and ultralytics)
        run: |
          set -euo pipefail
          if [ -d "cloud" ]; then echo "FORBIDDEN: cloud/ directory present"; exit 1; fi
          if grep -iE "ultralytics|yolov8" requirements.txt; then echo "FORBIDDEN: ultralytics dependency"; exit 1; fi

      - name: Verify Shell Scripts Syntax, Manifest SHA-256 & TypeScript Types Sync
        run: |
          set -euo pipefail
          bash -n migrations/verify_all_pg15.sh
          bash -n packages/contracts/01_database/verify_all_pg15.sh
          python3 scripts/verify_manifest.py
          python3 scripts/generate_ts_types.py
          git diff --exit-code packages/shared-types/src/v3-contracts.ts || (echo "TS types out of sync with v3.0 JSON Schemas"; exit 1)

      - name: Run v3.0 + HITL v2.2 Cross-Contract Verification (61 checks)
        run: |
          set -euo pipefail
          mkdir -p ci_logs
          python3 packages/contracts/09_tests_and_adr/verify_contracts.py 2>&1 | tee ci_logs/contract_verify.log

      - name: Sprint 0 & CR-001 Blocking Gate — Empty PG15+ Migrations (000..007) + Seeded RLS + FI-1/FI-2/FI-3 + Symmetric Rollback Round-Trip
        env:
          DATABASE_URL: postgres://postgres:postgres_ci_password@localhost:5432/aivs_sprint0_empty
        run: |
          set -euo pipefail
          bash migrations/verify_all_pg15.sh 2>&1 | tee ci_logs/sprint0_pg15_raw.log

      - name: Phase 6 Gate — Migration 008 Plugin Platform FORCE RLS + Symmetric Rollback Round-Trip
        env:
          DATABASE_URL: postgres://postgres:postgres_ci_password@localhost:5432/aivs_sprint0_empty
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/008_plugin_platform_rls.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/008_plugin_platform_rollback.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/008_plugin_platform_rls.sql

      - name: Run Full Automated Test Suite (Live PG15 psycopg Persistence + Multi-Track + Pixel Subtitle + Time Semantics v3)
        env:
          DATABASE_URL: postgres://postgres:postgres_ci_password@localhost:5432/aivs_sprint0_empty
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -v 2>&1 | tee ci_logs/automated_tests.log

      - name: Set up Node.js 20 & Build/Typecheck Phase 1 Web Editor (apps/web)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build & Typecheck Phase 1 Web Editor (apps/web)
        run: |
          set -euo pipefail
          cd apps/web
          npm install --no-audit --no-fund
          npm run build 2>&1 | tee ../../ci_logs/web_editor_build.log

      - name: Verify Production Docker Image Builds (API + Web)
        run: |
          set -euo pipefail
          docker build -f infra/docker/Dockerfile.api -t aivs-api:ci . 2>&1 | tee ci_logs/docker_api_build.log
          docker build -f infra/docker/Dockerfile.web -t aivs-web:ci . 2>&1 | tee ci_logs/docker_web_build.log

      - name: Upload Raw Sprint 0 & Protocol Freeze Logs as CI Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-protocol-freeze-and-pg15-logs
          path: ci_logs/
