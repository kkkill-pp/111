          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        proposal_id:
          type: string
          format: uuid
        timeline_version:
          type: integer
          minimum: 1
        proposal_checksum:
          type: string
          pattern: ^[a-f0-9]{64}$
        timeline_checksum:
          type: string
          pattern: ^[a-f0-9]{64}$
        issued_to_user_id:
          type: string
          format: uuid
        expires_at:
