          - UPDATE_SUBTITLE
          - REMOVE_SUBTITLE
          - ADD_TRANSITION
          - REMOVE_TRANSITION
          - ADD_OVERLAY
          - REMOVE_OVERLAY
          - SET_CANVAS_PROFILE
